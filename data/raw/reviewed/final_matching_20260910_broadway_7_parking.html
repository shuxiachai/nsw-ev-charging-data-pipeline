<p>&nbsp;</p>
<p>
<p style="color: #141413; margin-right: 0px; margin-bottom: 0.75rem; margin-left: 0px; padding: 0px;">There are 3 main entrances to the Broadway Sydney car park, all clearly signposted:</p>
<ul class="entrances" style="color: #141413; margin: 0.5rem 0px 1rem; padding: 0px 0px 0px 1.25rem; list-style-image: initial;">
    <li style="margin: 0px 0px 0.5rem; padding: 0px;"><strong style="margin: 0px; padding: 0px;">Bay Street entrance:</strong>&nbsp;Access via Bay Street or Smail Street at the traffic lights.</li>
    <li style="margin: 0px 0px 0.5rem; padding: 0px;"><strong style="margin: 0px; padding: 0px;">Francis Street entrance:</strong>&nbsp;Access via Grose Street and Glebe Point Road. This is the best entrance to access the North Car Park and South Car Park (for convenient access to Harris Farm and Coles).</li>
    <li style="margin: 0px 0px 0.5rem; padding: 0px;"><strong style="margin: 0px; padding: 0px;">Grose Street entrance:</strong>&nbsp;Access via Bay Street.</li>
</ul>
<p style="color: #141413; margin: 0px 0px 0.75rem; padding: 0px;">Our central Glebe location on Broadway makes us one of the most practical options for&nbsp;<strong style="margin: 0px; padding: 0px;">Sydney Fish Market parking</strong>&nbsp;&mdash; a short drive or walk from the market, with significantly lower rates than nearby alternatives.</p>
</p></div><!--/$--><!--$--><h2 class="display-3xl-bold ">Car Park Rates</h2><!--/$--><!--$--><div class="p-6 sm:p-10 rounded-xl info-table-bg info-table-heading-color"><div class="mb-10"><p class="display-base-regular body-lg-bold">Car Park Rates</p></div><div class="info-table-border flex justify-between border-b py-5"><div><p class="util-base-regular info-table-body-color">0-2 HOURS</p><p class="util-xs-regular info-table-hint-color mt-2">Once per day unless exit has been over 60 minutes</p></div><div><p class="util-base-regular "><div>FREE**</div></p></div></div><div class="info-table-border flex justify-between border-b py-5"><div><p class="util-base-regular info-table-body-color">2-3 HOURS</p><p class="util-xs-regular info-table-hint-color mt-2"></p></div><div><p class="util-base-regular "><div>$12.00</div></p></div></div><div class="info-table-border flex justify-between border-b py-5"><div><p class="util-base-regular info-table-body-color">3-4 HOURS</p><p class="util-xs-regular info-table-hint-color mt-2"></p></div><div><p class="util-base-regular "><div>$24.00</div></p></div></div><div class="info-table-border flex justify-between border-b py-5"><div><p class="util-base-regular info-table-body-color">4-5 HOURS</p><p class="util-xs-regular info-table-hint-color mt-2"></p></div><div><p class="util-base-regular "><div>$35.00</div></p></div></div><div class="info-table-border flex justify-between border-b py-5"><div><p class="util-base-regular info-table-body-color">5-6 HOURS</p><p class="util-xs-regular info-table-hint-color mt-2"></p></div><div><p class="util-base-regular "><div>$45.00</div></p></div></div><div class="info-table-border flex justify-between border-b py-5"><div><p class="util-base-regular info-table-body-color">6-7 HOURS</p><p class="util-xs-regular info-table-hint-color mt-2"></p></div><div><p class="util-base-regular "><div>$63.00</div></p></div></div><div class="info-table-border flex justify-between border-b py-5"><div><p class="util-base-regular info-table-body-color">7+ HOURS</p><p class="util-xs-regular info-table-hint-color mt-2"></p></div><div><p class="util-base-regular "><div>$79.00</div></p></div></div><div class="info-table-border flex justify-between border-b py-5"><div><p class="util-base-regular info-table-body-color">PARKING AFTER 6PM</p><p class="util-xs-regular info-table-hint-color mt-2">Must enter after 6.00pm and exit before 12.00am*</p></div><div><p class="util-base-regular "><div>FREE*</div></p></div></div><div class="info-table-border flex justify-between border-b py-5"><div><p class="util-base-regular info-table-body-color">STUDENT PARKING</p><p class="util-xs-regular info-table-hint-color mt-2">Must register with car park office prior to parking. </p></div><div><p class="util-base-regular "><div>$16 PER DAY MON-FRI</div></p></div></div></div><br/><!--/$--><!--$--><h2 class="display-3xl-bold ">Parking FAQ</h2><!--/$--><!--$--><div class="accordion-border border-t"><button type="button" class="w-full py-5 md:py-6"><div class="flex items-center"><div class="flex flex-1 items-center text-left"><p class="body-lg-medium accordion-heading-color">Hoyts Parking </p></div><div class="flex w-8 items-center justify-end"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" color="accordion-color" class="transition-rotate duration-300 -rotate-45"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6 6 18M6 6l12 12"></path></svg></div></div></button><div class="ReactCollapse--collapse" style="height:0px;overflow:hidden" aria-hidden="true"><div class="ReactCollapse--content"><div class="accordion-body-color pb-6  pr-6"><p class="body-base-regular accordion-body-color"><div><p>
</p>
<p>Hoyts patrons receive four hours of free parking, then normal rates apply. i.e. 4-5 hours will be $11.00. </p>
<p>You can validate your parking ticket by scanning the barcode from your movie tickets or Hoyts email confirmation at any auto-pay station.&nbsp;</p>
<p style="color: #64748a; margin: 0in; border: 0px solid;"><span style="color: #000000;"><strong>Please note: the p</strong></span><span style="color: #000000;"><strong>arking ticket must be validated on the day, prior to exit, to receive the Hoyts discounted parking.&nbsp;</strong></span></p>
<p style="color: #64748a; margin: 0in; border: 0px solid;">&nbsp;</p></div></p></div></div></div></div><div class="accordion-border border-t"><button type="button" class="w-full py-5 md:py-6"><div class="flex items-center"><div class="flex flex-1 items-center text-left"><p class="body-lg-medium accordion-heading-color">Is Broadway Sydney close to the Fish Market?</p></div><div class="flex w-8 items-center justify-end"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" color="accordion-color" class="transition-rotate duration-300 -rotate-45"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6 6 18M6 6l12 12"></path></svg></div></div></button><div class="ReactCollapse--collapse" style="height:0px;overflow:hidden" aria-hidden="true"><div class="ReactCollapse--content"><div class="accordion-body-color pb-6  pr-6"><p class="body-base-regular accordion-body-color"><div><p>
</p>
<p><span style="color: #3d3d3a;">Yes - Broadway Sydney is one of the closest and most affordable car parks to the Sydney Fish Market. Located on Bay Street in Glebe, we're approximately a 5-minute drive from the market, with free parking for the first 2 hours (once per day) and free evening parking when you enter after 6:00pm and exit before midnight. </span></p>
<p><span style="color: #3d3d3a;">Whether you're after&nbsp;</span><strong style="color: #3d3d3a; margin: 0px; padding: 0px;">cheap parking near the Sydney Fish Market</strong><span style="color: #3d3d3a;">&nbsp;or simply a convenient base for shopping, dining, and exploring Glebe, Broadway Sydney is an excellent choice. </span></p>
<p><span style="color: #3d3d3a;">Student parking is also available at $16 per day Monday to Friday.</span></p></div></p></div></div></div></div><div class="accordion-border border-t"><button type="button" class="w-full py-5 md:py-6"><div class="flex items-center"><div class="flex flex-1 items-center text-left"><p class="body-lg-medium accordion-heading-color">Parking Height</p></div><div class="flex w-8 items-center justify-end"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" color="accordion-color" class="transition-rotate duration-300 -rotate-45"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6 6 18M6 6l12 12"></path></svg></div></div></button><div class="ReactCollapse--collapse" style="height:0px;overflow:hidden" aria-hidden="true"><div class="ReactCollapse--content"><div class="accordion-body-color pb-6  pr-6"><p class="body-base-regular accordion-body-color"><div>Please note the maximum height permissible in our carpark for vehicles is 1.95m.&nbsp;<br />
If your vehicle is higher than 1.95m we recommend parking on Bay Street or surrounding.&nbsp;&nbsp;</div></p></div></div></div></div><div class="accordion-border border-t"><button type="button" class="w-full py-5 md:py-6"><div class="flex items-center"><div class="flex flex-1 items-center text-left"><p class="body-lg-medium accordion-heading-color">Student Parking</p></div><div class="flex w-8 items-center justify-end"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" color="accordion-color" class="transition-rotate duration-300 -rotate-45"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6 6 18M6 6l12 12"></path></svg></div></div></button><div class="ReactCollapse--collapse" style="height:0px;overflow:hidden" aria-hidden="true"><div class="ReactCollapse--content"><div class="accordion-body-color pb-6  pr-6"><p class="body-base-regular accordion-body-color"><div><p style="margin: 0in; border: 0px solid;">Ditch the daily trek to campus and park at Broadway Sydney - a 5 minute walk from your university.</p>
<p style="margin: 0in; border: 0px solid;">&nbsp;</p>
<p style="margin: 0in; border: 0px solid;">Simply purchase a $30 pass card (one-off, non-refundable payment) the first time you park to enjoy $16 daily parking on Level 3A or Level 4.<br style="border: 0px solid;" />
</p>
<p style="margin: 0in; border: 0px solid;">Present to the car park office (Located within the car park on the Ground Floor), provide your student ID, fill in the student parking application form.</p>
<p style="margin: 0in; border: 0px solid;">You will be given a Broadway Sydney Student pass card which you will purchase for $30 (non-refundable). This pass can be used to swipe into any entry (no need to pull a ticket from the machine) and then proceed up to Level 3A or 4 where you can swipe the pass card into the student area.</p>
<p style="margin: 0in; border: 0px solid;">Upon exit, insert the student parking card into an autopay machine where it will request a $16 all day payment. Once paid it will grant you exit out of the student area.&nbsp;&nbsp;&nbsp;</p>
<p style="margin: 0in; border: 0px solid;">&nbsp;</p>
<p style="margin: 0in; border: 0px solid;">For more information contact our friendly car park team on 02 9211 5635.</p></div></p></div></div></div></div><!--/$--><!--$--><h2 class="display-3xl-bold ">How To Get Here</h2><!--/$--><!--$--><div class="accordion-border border-t"><button type="button" class="w-full py-5 md:py-6"><div class="flex items-center"><div class="flex flex-1 items-center text-left"><p class="body-lg-medium accordion-heading-color">By Car</p></div><div class="flex w-8 items-center justify-end"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" color="accordion-color" class="transition-rotate duration-300 -rotate-45"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6 6 18M6 6l12 12"></path></svg></div></div></button><div class="ReactCollapse--collapse" style="height:0px;overflow:hidden" aria-hidden="true"><div class="ReactCollapse--content"><div class="accordion-body-color pb-6  pr-6"><p class="body-base-regular accordion-body-color"><div><p style="color: #64748a; margin-right: 0px; margin-bottom: 0px; margin-left: 0px; border: 0px solid;">
<p style="color: #141413; margin-right: 0px; margin-bottom: 0.75rem; margin-left: 0px; padding: 0px;">Broadway Sydney is conveniently located on the corner of Parramatta Road and Bay Street in Broadway, with 1,665 across our multi-level car park - making it one of the largest and most accessible car parks in the inner city.</p>
<p style="color: #141413; margin: 0px 0px 0.75rem; padding: 0px;">There are 3 main entrances, all clearly signposted:</p>
<ul class="entrances" style="color: #141413; margin: 0.5rem 0px 0px; padding: 0px 0px 0px 1.25rem; list-style-image: initial;">
    <li style="margin: 0px 0px 0.5rem; padding: 0px;"><strong style="margin: 0px; padding: 0px;">Bay Street entrance:</strong>&nbsp;Access via Bay Street or Smail Street at the traffic lights.</li>
    <li style="margin: 0px 0px 0.5rem; padding: 0px;"><strong style="margin: 0px; padding: 0px;">Francis Street entrance:</strong>&nbsp;Access via Grose Street and Glebe Point Road. This is the best entrance to access the North Car Park and South Car Park (for convenient access to Harris Farm and Coles).</li>
    <li style="margin: 0px 0px 0.5rem; padding: 0px;"><strong style="margin: 0px; padding: 0px;">Grose Street entrance:</strong>&nbsp;Access via Bay Street.</li>
</ul>
<p style="margin: 0px 0px 0.5rem; padding: 0px;">&nbsp;</p>
<p style="margin: 0px 0px 0.5rem; padding: 0px;">The By Car section now includes the address, the 1,665+ spot count, and all three entrances with their directions. I also moved the entrances list here from the top of the page since it fits naturally in this section &mdash; let me know if you'd prefer to keep both or make any other adjustments!</p>
</p></div></p></div></div></div></div><div class="accordion-border border-t"><button type="button" class="w-full py-5 md:py-6"><div class="flex items-center"><div class="flex flex-1 items-center text-left"><p class="body-lg-medium accordion-heading-color">By Public Transport</p></div><div class="flex w-8 items-center justify-end"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" color="accordion-color" class="transition-rotate duration-300 -rotate-45"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6 6 18M6 6l12 12"></path></svg></div></div></button><div class="ReactCollapse--collapse" style="height:0px;overflow:hidden" aria-hidden="true"><div class="ReactCollapse--content"><div class="accordion-body-color pb-6  pr-6"><p class="body-base-regular accordion-body-color"><div><p style="color: #64748a; margin-right: 0px; margin-bottom: 0px; margin-left: 0px; border: 0px solid;"><span style="text-decoration: underline;">By Train</span></p>
<p style="color: #64748a; margin: 0px; border: 0px solid;">Central Station is the closest train station to Broadway Sydney, services start from 4AM to midnight on most lines. Central Station is a 15 minute walk from Broadway Sydney. The station provides T1 North Shore, Northern line, T2 Airport Line, Inner West &amp; South Line, T3 Bankstown Line, T4 Eastern Suburbs &amp; Illawarra Line, Blue mountains Line, Central Coast &amp; Newcastle Line, South Coast &amp; Southern Highlands services.</p>
<p style="color: #64748a; margin: 0px; border: 0px solid;"><span style="text-decoration: underline;">&nbsp;</span></p>
<p style="color: #64748a; margin: 0px; border: 0px solid;"><span style="text-decoration: underline;">By Bus</span></p>
<p style="color: #64748a; margin: 0px; border: 0px solid;">Buses stop on Parramatta Rd and City Road, opposite the centre. They travel through the city and beyond almost 24 hours a day. All Sydney buses only accept OPAL cards. City of Sydney uses the prepaid cards to reduce delays, so you'll need to get an OPAL before you get on board. You will be able to acquire one from Coles, and most convenience stores. Bus routes L23, L28, M10, M30, 412, 413, 422, 423, 426, 428, 431, 433, 436, 438, 439, 440, 461, 470, 480, 483 all travel down Parramatta Rd. Simply exit the centre onto Parramatta Rd and cross to Victoria Park directly opposite the centre.</p>
<p style="color: #64748a; margin: 0px; border: 0px solid;">&nbsp;</p>
<p style="color: #64748a; margin: 0px; border: 0px solid;"><span style="text-decoration: underline;">By Light Rail</span></p>
<p style="color: #64748a; margin-top: 0px; margin-right: 0px; margin-left: 0px; border: 0px solid;">Our closest light rail stations are Glebe and Central. Both are a 15 minute walk from the centre. Services operate daily every 15 minutes from Central to Lilyfield between 6am and 11pm Monday to Thursday. On Friday and Saturdays, the service operates 6am to midnight. There is a 24hr service from Central to The Star operating every 15 minutes from 6am to midnight, then every 30 minutes until 6am.</p></div></p></div></div></div></div><!--/$--><!--$--><h2 class="display-3xl-bold ">Electric Vehicle Charging Stations FAQs</h2><!--/$--><!--$--><div class="accordion-border border-t"><button type="button" class="w-full py-5 md:py-6"><div class="flex items-center"><div class="flex flex-1 items-center text-left"><p class="body-lg-medium accordion-heading-color">Where are the electric vehicle charging stations located?</p></div><div class="flex w-8 items-center justify-end"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" color="accordion-color" class="transition-rotate duration-300 -rotate-45"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6 6 18M6 6l12 12"></path></svg></div></div></button><div class="ReactCollapse--collapse" style="height:0px;overflow:hidden" aria-hidden="true"><div class="ReactCollapse--content"><div class="accordion-body-color pb-6  pr-6"><p class="body-base-regular accordion-body-color"><div>The charging stations are located in the car park on B2 near the Bay Street exit.</div></p></div></div></div></div><div class="accordion-border border-t"><button type="button" class="w-full py-5 md:py-6"><div class="flex items-center"><div class="flex flex-1 items-center text-left"><p class="body-lg-medium accordion-heading-color">How much does it cost to charge your vehicle?</p></div><div class="flex w-8 items-center justify-end"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" color="accordion-color" class="transition-rotate duration-300 -rotate-45"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6 6 18M6 6l12 12"></path></svg></div></div></button><div class="ReactCollapse--collapse" style="height:0px;overflow:hidden" aria-hidden="true"><div class="ReactCollapse--content"><div class="accordion-body-color pb-6  pr-6"><p class="body-base-regular accordion-body-color"><div>Our electric vehicle charging stations are complimentary for customers. Please note - Tesla may charge some Tesla customers for use of the Superchargers.</div></p></div></div></div></div><div class="accordion-border border-t"><button type="button" class="w-full py-5 md:py-6"><div class="flex items-center"><div class="flex flex-1 items-center text-left"><p class="body-lg-medium accordion-heading-color">How long can I charge my vehicle?</p></div><div class="flex w-8 items-center justify-end"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" color="accordion-color" class="transition-rotate duration-300 -rotate-45"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6 6 18M6 6l12 12"></path></svg></div></div></button><div class="ReactCollapse--collapse" style="height:0px;overflow:hidden" aria-hidden="true"><div class="ReactCollapse--content"><div class="accordion-body-color pb-6  pr-6"><p class="body-base-regular accordion-body-color"><div>Customers are welcome to use the charging stations for as long as they wish. Please note that standard car parking rates apply.</div></p></div></div></div></div><div class="accordion-border border-t"><button type="button" class="w-full py-5 md:py-6"><div class="flex items-center"><div class="flex flex-1 items-center text-left"><p class="body-lg-medium accordion-heading-color">What hours are the charging stations available?</p></div><div class="flex w-8 items-center justify-end"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" color="accordion-color" class="transition-rotate duration-300 -rotate-45"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6 6 18M6 6l12 12"></path></svg></div></div></button><div class="ReactCollapse--collapse" style="height:0px;overflow:hidden" aria-hidden="true"><div class="ReactCollapse--content"><div class="accordion-body-color pb-6  pr-6"><p class="body-base-regular accordion-body-color"><div>The charging stations will be available to customers during the car park opening times.</div></p></div></div></div></div><div class="accordion-border border-t"><button type="button" class="w-full py-5 md:py-6"><div class="flex items-center"><div class="flex flex-1 items-center text-left"><p class="body-lg-medium accordion-heading-color">How many charging stations do you have?</p></div><div class="flex w-8 items-center justify-end"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" color="accordion-color" class="transition-rotate duration-300 -rotate-45"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6 6 18M6 6l12 12"></path></svg></div></div></button><div class="ReactCollapse--collapse" style="height:0px;overflow:hidden" aria-hidden="true"><div class="ReactCollapse--content"><div class="accordion-body-color pb-6  pr-6"><p class="body-base-regular accordion-body-color"><div>We currently have 8 Tesla Super Fast Chargers and 7 Universal Chargers</div></p></div></div></div></div><div class="accordion-border border-t"><button type="button" class="w-full py-5 md:py-6"><div class="flex items-center"><div class="flex flex-1 items-center text-left"><p class="body-lg-medium accordion-heading-color">The charging station won’t work for me, who can help?</p></div><div class="flex w-8 items-center justify-end"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" color="accordion-color" class="transition-rotate duration-300 -rotate-45"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6 6 18M6 6l12 12"></path></svg></div></div></button><div class="ReactCollapse--collapse" style="height:0px;overflow:hidden" aria-hidden="true"><div class="ReactCollapse--content"><div class="accordion-body-color pb-6  pr-6"><p class="body-base-regular accordion-body-color"><div>The centre management team will be able to assist with any faults in the first instance. If you have any questions or require assistance, please text 0428 722 767.</div></p></div></div></div></div><div class="accordion-border border-t"><button type="button" class="w-full py-5 md:py-6"><div class="flex items-center"><div class="flex flex-1 items-center text-left"><p class="body-lg-medium accordion-heading-color">What types of vehicles can use the charging stations?</p></div><div class="flex w-8 items-center justify-end"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" color="accordion-color" class="transition-rotate duration-300 -rotate-45"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6 6 18M6 6l12 12"></path></svg></div></div></button><div class="ReactCollapse--collapse" style="height:0px;overflow:hidden" aria-hidden="true"><div class="ReactCollapse--content"><div class="accordion-body-color pb-6  pr-6"><p class="body-base-regular accordion-body-color"><div>We have both Type One and Type Two connectors on the cables so you can charge regardless of manufacturer. These are on the white charging pods. The grey charging units are Tesla Type Two and should be used only by Tesla vehicles.</div></p></div></div></div></div><div class="accordion-border border-t"><button type="button" class="w-full py-5 md:py-6"><div class="flex items-center"><div class="flex flex-1 items-center text-left"><p class="body-lg-medium accordion-heading-color">Do we need to provide our own adapters?</p></div><div class="flex w-8 items-center justify-end"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" color="accordion-color" class="transition-rotate duration-300 -rotate-45"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 6 6 18M6 6l12 12"></path></svg></div></div></button><div class="ReactCollapse--collapse" style="height:0px;overflow:hidden" aria-hidden="true"><div class="ReactCollapse--content"><div class="accordion-body-color pb-6  pr-6"><p class="body-base-regular accordion-body-color"><div>No, you can leave yours in the boot. While there is a move toward a single connector type in Australia there will always be at least 1 x Type One and 1 x Type Two cable onsite.</div></p></div></div></div></div><!--/$--></div></div></div></div><div style="width:50%" class="two-column-layout-column"><div><div><div id="contentaside"><!--$--><div class="aside-bg p-6 rounded-xl"><div class="mb-10"><p class="body-base-regular aside-heading-color mb-[20px] body-lg-bold">Parking Support</p><p class="body-base-regular aside-body-color pb-[10px]">Ample parking awaits! For more information head to our parking FAQ tab.</p></div><div class="mb-10"><div class="aside-icon-text-color mb-[20px]"><div class=" flex justify-between"><div class="flex"><div class="mr-3"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" class="text-neutral-900 "><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6l4 2m6-2c0 5.523-4.477 10-10 10S2 17.523 2 12 6.477 2 12 2s10 4.477 10 10"></path></svg></div><p class="util-base-regular flex items-center">6am - Midnight</p></div><p class="util-base-regular aside-body-color flex items-center"></p></div></div><div class="aside-icon-text-color mb-[20px]"><div class=" flex justify-between"><div class="flex"><div class="mr-3"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" class="text-neutral-900 "><p tion":{"value":"Broadway Sydney"},"Name":{"value":"Minis: Fun Freebies Every Month"},"Offer Body":{"value":"\u003cp\u003eHey Minis Member! Guess what? If you're part of the Broadway\u0026nbsp;Minis, you're in for a treat - literally!\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cspan data-contrast=\"auto\" class=\"TextRun SCXW110897955 BCX0\" style=\"border: 0px #000000; opacity: 1; height: auto; width: auto; margin: 0px; padding: 0px; border-spacing: 0px; list-style-type: disc; list-style-image: none; line-height: 20.925px;\"\u003e\u003cspan class=\"NormalTextRun SCXW110897955 BCX0\"\u003e🎁\u0026nbsp;\u003c/span\u003e\u003c/span\u003eEach month, we're giving away an exciting FREEBIE to Minis member card holders! The best part? It changes each month, so there's always something new to look forward to! Whether you're dropping in for some groceries or going on a shopping spree, picking up your monthly freebie is a fun little bonus to make your Broadway\u0026nbsp;visit extra special.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSeptember Freebie \u003c/strong\u003e=\u0026nbsp;\u003cspan style=\"color: #000000;\"\u003eFREE movie at HOYTS for Broadway Minis members\u003c/span\u003e, Level 2, outside \u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003ca href=\"https://www.broadwaysydney.com.au/stores/entertainment/hoyts-cinema\"\u003eHOYTS.\u003c/a\u003e*\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003eRedemption Dates:\u003c/p\u003e\n\u003cp\u003e\n\u003cdiv style=\"color: #000000; line-height: 20px;\"\u003e\n\u003cli\u003eSunday 6 September | 10am - 2pm\u003c/li\u003e\n\u003cli\u003eSunday 13 September | 10am - 2pm\u003c/li\u003e\n\u003cli\u003eSunday 20 September | 10am - 2pm\u003c/li\u003e\n\u003cli\u003eSunday 27 September | 10am - 2pm\u003c/li\u003e\n\u003c/div\u003e\n\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u003cspan data-contrast=\"auto\" class=\"TextRun SCXW134758452 BCX0\" style=\"border: 0px #000000; opacity: 1; height: auto; width: auto; margin: 0px; padding: 0px; border-spacing: 0px; list-style-type: disc; list-style-image: none; line-height: 20.925px;\"\u003e\u003cspan class=\"NormalTextRun SCXW134758452 BCX0\"\u003e\u003cstrong\u003e✨\u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003c/span\u003e\u003cstrong\u003eHow to Claim your Monthly Freebie:\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e1. Scan the QR code on your Minis Member Card\u003c/p\u003e\n\u003cp\u003e2. Follow the prompts to the Freebie redemption page and fill out the form\u003c/p\u003e\n\u003cp\u003e3. Head to the collection point with your Minis Member Card and prefilled form\u003c/p\u003e\n\u003cp\u003e4. Pick up your Freebie and enjoy!\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cdiv style=\"color: #000000; line-height: 20px;\"\u003e\n\u003cdiv style=\"color: #000000; line-height: 20px;\"\u003e\n\u003cp\u003e\u003cstrong\u003e🎟️ Important Information:\u003c/strong\u003e\u003c/p\u003e\n\u003cul\u003e\n    \u003cli\u003eMovie vouchers are \u003cstrong\u003eonly valid on the day they are redeemed\u003c/strong\u003e.\u003c/li\u003e\n    \u003cli\u003eVouchers \u003cstrong\u003emust be used for a movie session showing between 10am and 2pm on the same day\u003c/strong\u003e.\u003c/li\u003e\n    \u003cli\u003eVouchers cannot be saved for another date or session time.\u003c/li\u003e\n    \u003cli\u003e\u003cstrong\u003eOne movie voucher per Broadway Minis member per month.\u003c/strong\u003e\u003c/li\u003e\n    \u003cli\u003eTickets are limited and available on a first-come, first-served basis.\u003c/li\u003e\n    \u003cli\u003eWhile stocks last.\u003c/li\u003e\n    \u003cli\u003e\u003cem\u003eTerms and conditions apply. View the full Terms \u0026amp; Conditions\u0026nbsp;\u003c/em\u003e\u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u00 e\n2.\u0026nbsp;\u003cstrong\u003eLevel up your membership!\u0026nbsp;\u003c/strong\u003e\u003cspan class=\"cf0\"\u003eBring your Minis (children 12yrs \u0026amp; under, max. 3 per family)\u0026nbsp;\u003c/span\u003e\u003cspan class=\"cf0\"\u003eand head\u0026nbsp;\u003c/span\u003eto our \u003cstrong\u003eMinis Membership Card Collection Desk\u003c/strong\u003e\u0026nbsp;on one of the collection dates specified below, fill out a short collection form and pick up your card to access more offers!\u003cbr /\u003e\n\u003cspan style=\"color: #000000;\"\u003e\u003cbr /\u003e\n\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u003cspan style=\"color: #000000;\"\u003e🧡\u0026nbsp;\u003cstrong\u003eAlready a Minis member?\u0026nbsp;\u003c/strong\u003eGreat! To claim your card, follow step 2!\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u003cspan style=\"color: #000000;\"\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003e\u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003e📅 COLLECTION DATES:\u003c/strong\u003e\u003c/span\u003e\u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e- Sunday 6 September from 10am - 2pm, near \u003cstrong\u003e\u003ca href=\"https://www.broadwaysydney.com.au/stores/entertainment/hoyts-cinema\"\u003e\u003cspan style=\"text-decoration: underline;\"\u003eHOYTS\u003c/span\u003e\u003c/a\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;- Saturday 12 September\u0026nbsp;from 10am - 2pm, near \u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003ca href=\"/stores/shopping/lovisa\"\u003eLovisa\u003c/a\u003e\u003c/span\u003e\u003c/strong\u003e\u003c/p\u003e\n\u003cp\u003e- Sunday 13 September from 10am - 2pm, near \u003cstrong\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u003ca href=\"https://www.broadwaysydney.com.au/stores/entertainment/hoyts-cinema\"\u003eHOYTS\u003 d44b154d","componentName":"RichText","dataSource":"/sitecore/content/Retail 2023/Broadway/Home/Visit/Parking/Data/1 - Intro Text","isContentResolved":true,"fields":{"Text":{"value":"\u003cp\u003e\u003cspan style=\"color: #141413;\"\u003eBroadway Sydney offers convenient, affordable parking right in the heart of Glebe \u0026mdash; making us a top choice for\u0026nbsp;\u003c/span\u003e\u003cstrong style=\"color: #141413; margin: 0px; padding: 0px;\"\u003eparking near the Sydney Fish Market\u003c/strong\u003e\u003cspan style=\"color: #141413;\"\u003e, which is just minutes away. Whether you're visiting for a quick shop or a full day out, our car park has you covered.\u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp\u003e\n\u003cp style=\"color: #141413; margin-right: 0px; margin-bottom: 0.75rem; margin-left: 0px; padding: 0px;\"\u003eThere are 3 main entrances to the Broadway Sydney car park, all clearly signposted:\u003c/p\u003e\n\u003cul class=\"entrances\" style=\"color: #141413; margin: 0.5rem 0px 1rem; padding: 0px 0px 0px 1.25rem; list-style-image: initial;\"\u003e\n    \u003cli style=\"margin: 0px 0px 0.5rem; padding: 0px;\"\u003e\u003cstrong style=\"margin: 0px; padding: 0px;\"\u003eBay Street entrance:\u003c/strong\u003e\u0026nbsp;Access via Bay Street or Smail Street at the traffic lights.\u003c/li\u003e\n    \u003cli style=\"margin: 0px 0px 0.5rem; padding: 0px;\"\u003e\u003cstrong style=\"margin: 0px; padding: 0px;\"\u003eFrancis Street entrance:\u003c/strong\u003e\u0026nbsp;Access via Grose Street and Glebe Point Road. This is the best entrance to access the North Car Park and South Car Park (for convenient access to Harris Farm and Coles).\u003c/li\u003e\n    \u003cli style=\"margin: 0px 0px 0.5rem; padding: 0px;\"\u003e\u003cstrong style=\"margin: 0px; padding: 0px;\"\u003eGrose Street entrance:\u003c/strong\u003e\u0026nbsp;Access via Bay Street.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp style=\"color: #141413; margin: 0px 0px 0.75rem; padding: 0px;\"\u003eOur central Glebe location on Broadway makes us one of the most practical options for\u0026nbsp;\u003cstrong style=\"margin: 0px; padding: 0px;\"\u003eSydney Fish Market parking\u003c/strong\u003e\u0026nbsp;\u0026mdash; a short drive or walk from the market, with significantly lower rates than nearby alternatives.\u003c/p\u003e\n\u003c/p\u003e"}}},{"uid":"3cae67f2-527f-4524-8e9b-8660c599967b","componentName":"RichTextHeading","dataSource":"/sitecore/content/Retail 2023/Broadway/Home/Visit/Parking/Data/2 - Car Park Rates Heading","isContentResolved":true,"fields":{"Heading":{"value":"Car Park Rates"}}},{"uid":"1cf353b3-b0ad-4a2f-ab20-0a8fde93644e","componentName":"Info Table","dataSource":"/sitecore/content/Retail 2023/Broadway/Home/Visit/Parking/Data/3 - Car Park Rates","isContentResolved":true,"params":{"Heading":"Car Park Rates"},"fields":{"items":[{"id":"cdf1bcb6-3f89-4432-84cd-03676fd94c10","url":"/visit/parking/data/3---car-park-rates/1---2-hours","name":"1 - 2 hours","displayName":"1 - 2 hours","fields":{"Detail":{"value":"FREE**"},"Help":{"value":"Once per day unless exit has been over 60 minutes"},"Label":{"value":"0-2 HOURS"}}},{"id":"3ae4190a-f996-471d-a02f-ae7f23c5b00a","url":"/visit/parking/data/3---car-park-rates/2---3-hours","name":"2 - 3 Hours","displayName":"2 - 3 Hours","fields":{"Detail":{"value":"$12.00"},"Help":{"value":""},"Label":{"value":"2-3 HOURS"}}},{"id":"c6953cf4-52f2-4c18-a94c-4fcf9bcb0f68","url":"/visit/parking/data/3---car-park-rates/3-4-hours","name":"3-4 hours","displayName":"3-4 hours","fields":{"Detail":{"value":"$24.00"},"Help":{"value":""},"Label":{"value":"3-4 HOURS"}}},{"id":"63c203be-ee6c-434c-a033-fae4f2e273a8","url":"/visit/parking/data/3---car-park-rates/4---5-hours","name":"4 - 5 hours","displayName":"4 - 5 hours","fields":{"Detail":{"value":"$35.00"},"Help":{"value":""},"Label":{"value":"4-5 HOURS"}}},{"id":"5893ce87-611c-47a6-964d-fae509bc5e7e","url":"/visit/parking/data/3---car-park-rate \n\u003cp\u003eHoyts patrons receive four hours of free parking, then normal rates apply. i.e. 4-5 hours will be $11.00. \u003c/p\u003e\r\n\u003cp\u003eYou can validate your parking ticket by scanning the barcode from your movie tickets or Hoyts email confirmation at any auto-pay station.\u0026nbsp;\u003c/p\u003e\r\n\u003cp style=\"color: #64748a; margin: 0in; border: 0px solid;\"\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003ePlease note: the p\u003c/strong\u003e\u003c/span\u003e\u003cspan style=\"color: #000000;\"\u003e\u003cstrong\u003earking ticket must be validated on the day, prior to exit, to receive the Hoyts discounted parking.\u0026nbsp;\u003c/strong\u003e\u003c/span\u003e\u003c/p\u003e\r\n\u003cp style=\"color: #64748a; margin: 0in; border: 0px solid;\"\u003e\u0026nbsp;\u003c/p\u003e"}}},{"id":"c4e862cc-7bed-49b4-92ee-38a5ca7ffa3e","url":"/visit/parking/data/parking-faq-accordion/is-broadway-sydney-close-to-the-fish-market","name":"Is Broadway Sydney close to the Fish Market","displayName":"Is Broadway Sydney close to the Fish Market","fields":{"Heading":{"value":"Is Broadway Sydney close to the Fish Market?"},"Text":{"value":"\u003cp\u003e\n\u003c/p\u003e\n\u003cp\u003e\u003cspan style=\"color: #3d3d3a;\"\u003eYes - Broadway Sydney is one of the closest and most affordable car parks to the Sydney Fish Market. Located on Bay Street in Glebe, we're approximately a 5-minute drive from the market, with free parking for the first 2 hours (once per day) and free evening parking when you enter after 6:00pm and exit before midnight. \u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u003cspan style=\"color: #3d3d3a;\"\u003eWhether you're after\u0026nbsp;\u003c/span\u003e\u003cstrong style=\"color: #3d3d3a; margin: 0px; padding: 0px;\"\u003echeap parking near the Sydney Fish Market\u003c/strong\u003e\u003cspan style=\"color: #3d3d3a;\"\u003e\u0026nbsp;or simply a convenient base for shopping, dining, and exploring Glebe, Broadway Sydney is an excellent choice. \u003c/span\u003e\u003c/p\u003e\n\u003cp\u003e\u003cspan style=\"color: #3d3d3a;\"\u003eStudent parking is also available at $16 per day Monday to Friday.\u003c/span\u003e\u003c/p\u003e"}}},{"id":"f2f81d3a-ba11-4ae3-bfea-c3cefb80cf5a","url":"/visit/parking/data/parking-faq-accordion/parking-heights","name":"Parking Heights","displayName":"Parking Heights","fields":{"Heading":{"value":"Parking Height"},"Text":{"value":"Please note the maximum height permissible in our carpark for vehicles is 1.95m.\u0026nbsp;\u003cbr /\u003e\r\nIf your vehicle is higher than 1.95m we recommend parking on Bay Street or surrounding.\u0026nbsp;\u0026nbsp;"}}},{"id":"a8da3acc-b1fd-45ba-bf97-dff82f47792b","url":"/visit/parking/data/parking-faq-accordion/student-parking","name":"Student Parking","displayName":"Student Parking","fields":{"Heading":{"value":"Student Parking"},"Text":{"value":"\u003cp style=\"margin: 0in; border: 0px solid;\"\u003eDitch the daily trek to campus and park at Broadway Sydney - a 5 minute walk from your university.\u003c/p\u003e\n\u003cp style=\"margin: 0in; border: 0px solid;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; border: 0px solid;\"\u003eSimply purchase a $30 pass card (one-off, non-refundable payment) the first time you park to enjoy $16 daily parking on Level 3A or Level 4.\u003cbr style=\"border: 0px solid;\" /\u003e\n\u003c/p\u003e\n\u003cp style=\"margin: 0in; border: 0px solid;\"\u003ePresent to the car park office (Located within the car park on the Ground Floor), provide your student ID, fill in the student parking application form.\u003c/p\u003e\n\u003cp style=\"margin: 0in; border: 0px solid;\"\u003eYou will be given a Broadway Sydney Student pass card which you will purchase for $30 (non-refundable). This pass can be used to swipe into any entry (no need to pull a ticket from the machine) and then proceed up to Level 3A or 4 where you can swipe the pass card into the student area.\u003c/p\u003e\n\u003cp style=\"margin: 0in; border: 0px solid;\"\u003eUpon exit, insert the student parking card into an autopay machine where it will request a $16 all day payment. Once paid it will grant you exit out of the student area.\u0026nbsp;\u0026nbsp;\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; border: 0px solid;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0in; border: 0px solid;\"\u003eFor more information contact our friendly car park team on 02 9211 5635.\u003c/p\u003e"}}}]}},{"uid":"45c87238-d993-4eed-b7cd-1c8c5a59e32d","componentName":"RichTextHeading","dataSource":"/sitecore/content/Retail 2023/Broadway/Home/Visit/Parking/Data/4 - How To Get Here Header","isContentResolved":true,"fields":{"Heading":{"value":"How To Get Here"}}},{"uid":"4604714c-48b3-42d2-a07b-d9f0f6a1a689","componentName":"Accordion","dataSource":"/sitecore/content/Retail 2023/Broadway/Home/Visit/Parking/Data/4 - How To Get Here Accordion","isContentResolved":true,"fields":{"items":[{"id":"19cd40a8-00a5-446a-acb6-98aeca76d4c0","url":"/visit/parking/data/4---how-to-get-here-accordion/by-car","name":"By Car","displayName":"By Car","fields":{"Heading":{"value":"By Car"},"Text":{"value":"\u003cp style=\"color: #64748a; margin-right: 0px; margin-bottom: 0px; margin-left: 0px; border: 0px solid;\"\u003e\n\u003cp style=\"color: #141413; margin-right: 0px; margin-bottom: 0.75rem; margin-left: 0px; padding: 0px;\"\u003eBroadway Sydney is conveniently located on the corner of Parramatta Road and Bay Street in Broadway, with 1,665 across our multi-level car park - making it one of the largest and most accessible car parks in the inner city.\u003c/p\u003e\n\u003cp style=\"color: #141413; margin: 0px 0px 0.75rem; padding: 0px;\"\u003eThere are 3 main entrances, all clearly signposted:\u003c/p\u003e\n\u003cul class=\"entrances\" style=\"color: #141413; margin: 0.5rem 0px 0px; padding: 0px 0px 0px 1.25rem; list-style-image: initial;\"\u003e\n    \u003cli style=\"margin: 0px 0px 0.5rem; padding: 0px;\"\u003e\u003cstrong style=\"margin: 0px; padding: 0px;\"\u003eBay Street entrance:\u003c/strong\u003e\u0026nbsp;Access via Bay Street or Smail Street at the traffic lights.\u003c/li\u003e\n    \u003cli style=\"margin: 0px 0px 0.5rem; padding: 0px;\"\u003e\u003cstrong style=\"margin: 0px; padding: 0px;\"\u003eFrancis Street entrance:\u003c/strong\u003e\u0026nbsp;Access via Grose Street and Glebe Point Road. This is the best entrance to access the North Car Park and South Car Park (for convenient access to Harris Farm and Coles).\u003c/li\u003e\n    \u003cli style=\"margin: 0px 0px 0.5rem; padding: 0px;\"\u003e\u003cstrong style=\"margin: 0px; padding: 0px;\"\u003eGrose Street entrance:\u003c/strong\u003e\u0026nbsp;Access via Bay Street.\u003c/li\u003e\n\u003c/ul\u003e\n\u003cp style=\"margin: 0px 0px 0.5rem; padding: 0px;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"margin: 0px 0px 0.5rem; padding: 0px;\"\u003eThe By Car section now includes the address, the 1,665+ spot count, and all three entrances with their directions. I also moved the entrances list here from the top of the page since it fits naturally in this section \u0026mdash; let me know if you'd prefer to keep both or make any other adjustments!\u003c/p\u003e\n\u003c/p\u003e"}}},{"id":"8820781c-9fb1-40f6-8d96-54d0e595d912","url":"/visit/parking/data/4---how-to-get-here-accordion/by-public-transport","name":"By Public Transport","displayName":"By Public Transport","fields":{"Heading":{"value":"By Public Transport"},"Text":{"value":"\u003cp style=\"color: #64748a; margin-right: 0px; margin-bottom: 0px; margin-left: 0px; border: 0px solid;\"\u003e\u003cspan style=\"text-decoration: underline;\"\u003eBy Train\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"color: #64748a; margin: 0px; border: 0px solid;\"\u003eCentral Station is the closest train station to Broadway Sydney, services start from 4AM to midnight on most lines. Central Station is a 15 minute walk from Broadway Sydney. The station provides T1 North Shore, Northern line, T2 Airport Line, Inner West \u0026amp; South Line, T3 Bankstown Line, T4 Eastern Suburbs \u0026amp; Illawarra Line, Blue mountains Line, Central Coast \u0026amp; Newcastle Line, South Coast \u0026amp; Southern Highlands services.\u003c/p\u003e\n\u003cp style=\"color: #64748a; margin: 0px; border: 0px solid;\"\u003e\u003cspan style=\"text-decoration: underline;\"\u003e\u0026nbsp;\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"color: #64748a; margin: 0px; border: 0px solid;\"\u003e\u003cspan style=\"text-decoration: underline;\"\u003eBy Bus\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"color: #64748a; margin: 0px; border: 0px solid;\"\u003eBuses stop on Parramatta Rd and City Road, opposite the centre. They travel through the city and beyond almost 24 hours a day. All Sydney buses only accept OPAL cards. City of Sydney uses the prepaid cards to reduce delays, so you'll need to get an OPAL before you get on board. You will be able to acquire one from Coles, and most convenience stores. Bus routes L23, L28, M10, M30, 412, 413, 422, 423, 426, 428, 431, 433, 436, 438, 439, 440, 461, 470, 480, 483 all travel down Parramatta Rd. Simply exit the centre onto Parramatta Rd and cross to Victoria Park directly opposite the centre.\u003c/p\u003e\n\u003cp style=\"color: #64748a; margin: 0px; border: 0px solid;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"color: #64748a; margin: 0px; border: 0px solid;\"\u003e\u003cspan style=\"text-decoration: underline;\"\u003eBy Light Rail\u003c/span\u003e\u003c/p\u003e\n\u003cp style=\"color: #64748a; margin-top: 0px; margin-right: 0px; margin-left: 0px; border: 0px solid;\"\u003eOur closest light rail stations are Glebe and Central. Both are a 15 minute walk from the centre. Services operate daily every 15 minutes from Central to Lilyfield between 6am and 11pm Monday to Thursday. On Friday and Saturdays, the service operates 6am to midnight. There is a 24hr service from Central to The Star operating every 15 minutes from 6am to midnight, then every 30 minutes until 6am.\u003c/p\u003e"}}}]}},{"uid":"44d07723-2fdc-430e-b701-a95b6034f18c","componentName":"RichTextHeading","dataSource":"/sitecore/content/Retail 2023/Broadway/Home/Visit/Parking/Data/5 - Electric Vehicle Heading","isContentResolved":true,"fields":{"Heading":{"value":"Electric Vehicle Charging Stations FAQs"}}},{"uid":"30028059-5b9e-48ef-8c87-40a851e028a6","componentName":"Accordion","dataSource":"/sitecore/content/Retail 2023/Broadway/Home/Visit/Parking/Data/6 - Electric Vehicle Accordion","isContentResolved":true,"fields":{"items":[{"id":"818aa71f-de85-4c64-aeb8-256df76db268","url":"/visit/parking/data/6---electric-vehicle-accordion/where-are-the-electric-vehicle-charging-stations-located","name":"Where are the electric vehicle charging stations located","displayName":"Where are the electric vehicle charging stations located","fields":{"Heading":{"value":"Where are the electric vehicle charging stations located?"},"Text":{"value":"The charging stations are located in the car park on B2 near the Bay Street exit."}}},{"id":"f8fcd0ca-edac-47f3-a7f1-520ac5bc2f86","url":"/visit/parking/data/6---electric-vehicle-accordion/how-much","name":"How much","displayName":"How much","fields":{"Heading":{"value":"How much does it cost to charge your vehicle?"},"Text":{"value":"Our electric vehicle charging stations are complimentary for customers. Please note - Tesla may charge some Tesla customers for use of the Superchargers."}}},{"id":"2d1182a8-c132-4630-9c1b-a158972e0cde","url":"/visit/parking/data/6---electric-vehicle-accordion/how-long","name":"How long","displayName":"How long","fields":{"Heading":{"value":"How long can I charge my vehicle?"},"Text":{"value":"Customers are welcome to use the charging stations for as long as they wish. Please note that standard car parking rates apply."}}},{"id":"8a6c3f1a-7939-47f8-8ada-8b5455560c68","url":"/visit/parking/data/6---electric-vehicle-accordion/what-hours","name":"What hours","displayName":"What hours","fields":{"Heading":{"value":"What hours are the charging stations available?"},"Text":{"value":"The charging stations will be available to customers during the car park opening times."}}},{"id":"fbe4548a-9be3-4c9b-83c1-944bf062c795","url":"/visit/parking/data/6---electric-vehicle-accordion/how-many-stations","name":"How many stations","displayName":"How many stations","fields":{"Heading":{"value":"How many charging stations do you have?"},"Text":{"value":"We currently have 8 Tesla Super Fast Chargers and 7 Universal Chargers"}}},{"id":"3f0718c0-58f7-426e-983d-9070ab313096","url":"/visit/parking/data/6---electric-vehicle-accordion/not-working","name":"Not working","displayName":"Not working","fields":{"Heading":{"value":"The charging station won’t work for me, who can help?"},"Text":{"value":"The centre management team will be able to assist with any faults in the first instance. If you have any questions or require assistance, please text 0428 722 767."}}},{"id":"9a8b95e7-0c39-4915-914b-89f467e8bab2","url":"/visit/parking/data/6---electric-vehicle-accordion/which-vehicles","name":"Which vehicles","displayName":"Which vehicles","fields":{"Heading":{"value":"What types of vehicles can use the charging stations?"},"Text":{"value":"We have both Type One and Type Two connectors on the cables so you can charge regardless of manufacturer. These are on the white charging pods. The grey charging units are Tesla Type Two and should be used only by Tesla vehicles."}}},{"id":"b9d5e79a-0a2d-4448-bfd7-59a092e24b18","url":"/visit/parking/data/6---electric-vehicle-accordion/adapters","name":"Adapters","displayName":"Adapters","fields":{"Heading":{"value":"Do we need to provide our own adapters?"},"Text":{"value":"No, you can leave yours in the boot. While there is a move toward a single connector type in Australia there will always be at least 1 x Type One and 1 x Type Two cable onsite."}}}]}}],"column-aside":[{"uid":"c3c78947-67b8-4e56-90da-ce103b15ee4a","componentName":"AsideTable","dataSource":"{165ADE9B-FAA1-40A9-966E-E440BEB3970C}","isContentResolved":true,"params":{"Heading":"Parking Support","Body":"Ample parking awaits! For more information head to our parking FAQ tab."},"fields":{"items":[{"id":"1cfd3690-7fad-4ac5-929e-25f7f95e448b","url":"/visit/centre-info-and-services/data/parking-support-table/1---opening-hours","name":"1 - Opening Hours","displayName":"1 - Opening Hours","fields":{"icon":{"value":"clock"},"Label":{"value":"6am - Midnight"},"Label Link":{"value":{"href":""}}}},{"id":"1c962a95-8d77-45b5-bc78-3c1f3daeb7a9","url":"/visit/centre-info-and-services/data/parking-support-table/2---phone-contact","name":"2 - Phone Contact","displayName":"2 - Phone Contact","fields":{"icon":{"value":"phone"},"Label":{"value":"02 9211 5635"},"Label Link":{"value":{"href":""}}}},{"id":"f03964cc-10f7-4b97-aff2-5e3aa70d1e8f","url":"/visit/centre-info-and-services/data/parking-support-table/3--permanent-parking","name":"3 -Permanent Parking","displayName":"3 -Permanent Parking","fields":{"icon":{"value":"mail-02"},"Label":{"value":"Permanent Parking "},"Label Link":{"value":{"href":"https://www.broadwaysydney.com.au/Experience/Offers/permanent-parking","text":"https://www.broadwaysydney.com.au/Experience/Offers/permanent-parking","linktype":"external","url":"https://www.broadwaysydney.com.au/Experience/Offers/permanent-parking","anchor":"","target":"_blank"}}}}]}}]},"published":"2026-09-09T18:05:45.9392491Z"}}},"dictionary":{},"headLinks":[],"componentProps":{}},"__N_SSG":true},"page":"/[[...path]]","query":{"path":["visit","parking"]},"buildId":"UeAEYmoLnSIo4l9eczyNj","assetPrefix":"https://www.broadwaysydney.com.au","isFallback":false,"isExperimentalCompile":false,"gsp":true,"locale":"en","locales":["en"],"defaultLocale":"en","scriptLoader":[]}</script></body></html>
